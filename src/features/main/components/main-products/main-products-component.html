<section class="main-products-root" aria-labelledby="main-products-title">
  <div class="main-products__header">
    <h2 id="main-products-title" class="main-products__title font-dewi">
      Решим любую вашу задачу по зонированию помещений
    </h2>
    <div class="main-products__actions">
      <p class="main-products__text">
        Наши решения помогают создавать светлые, стильные и функциональные пространства, в которых
        сочетаются эстетика, безопасность и практичность
      </p>
      <div class="main-products__nav" aria-label="Навигация по слайдам">
        <button
          type="button"
          class="main-products__nav-btn"
          (click)="prev()"
          aria-label="Предыдущий слайд"
        >
          <img
            class="main-products__nav-icon"
            src="/icons/arrow-left.png"
            width="22"
            height="22"
            alt=""
          />
        </button>
        <button
          type="button"
          class="main-products__nav-btn"
          (click)="next()"
          aria-label="Следующий слайд"
        >
          <img
            class="main-products__nav-icon"
            src="/icons/arrow-right.png"
            width="22"
            height="22"
            alt=""
          />
        </button>
      </div>
    </div>
  </div>

  <div class="main-products__swiper-bleed">
    <swiper-container
      #swiperEl
      class="main-products__swiper"
      slides-per-view="3"
      space-between="16"
      navigation="false"
      pagination="false"
      loop="true"
      [attr.breakpoints]="swiperBreakpointsAttr"
    >
      @for (slide of slides; track $index) {
        <swiper-slide>
          <article
            class="main-products__slide"
            [class.main-products__slide--dark]="slide.accent === 'dark'"
            [class.main-products__slide--light]="slide.accent === 'light'"
          >
            <img class="main-products__slide-bg" [src]="slide.image" [alt]="slide.alt" loading="lazy" />
            <div class="main-products__slide-overlay">
              <h3 class="main-products__slide-title font-dewi">{{ slide.title }}</h3>
              <div class="main-products__slide-actions">
                <a
                  class="main-products__pill font-montserrat"
                  [routerLink]="['/products', slide.slug]"
                  [attr.aria-label]="'Подробнее: ' + slide.title"
                ><span class="main-products__pill-label">{{ slide.category }}</span><span class="main-products__pill-arrow" aria-hidden="true"></span></a>
              </div>
            </div>
          </article>
        </swiper-slide>
      }
    </swiper-container>
  </div>
</section>
