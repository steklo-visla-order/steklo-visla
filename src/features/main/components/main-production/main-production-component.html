<section class="production" aria-labelledby="production-title">
  <div class="production__content">
    <h2 id="production-title" class="production__content-title font-dewi">Производство и монтаж</h2>
    <h3 class="production__content-subtitle font-dewi">стеклянных перегородок</h3>
    <p class="production__content-text">
      Мы специализируемся на проектировании, производстве и установке современных стеклянных
      конструкций для жилых и коммерческих объектов
    </p>

    <div class="production__buttons">
      <button type="button" (click)="onOpenCallbackModal()">
        Заказать звонок
        <span class="production__btn-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" focusable="false">
            <path
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M7 17 17 7 M9 7h8 M17 7v8"
            />
          </svg>
        </span>
      </button>
    </div>

    <div class="production__cards">
      <div class="production__card-white">
        <h4 class="card-title font-montserrat">1 500+</h4>
        <p class="card-text">реализованных проектов</p>
      </div>
      <div class="production__card-orange">
        <h4 class="card-title font-montserrat">0₽</h4>
        <p class="card-text">выезд замерщика бесплатно</p>
      </div>
      <div class="production__card-black">
        <h4 class="card-title font-montserrat">5 лет</h4>
        <p class="card-text">опыт работы на рынке</p>
      </div>
    </div>
  </div>
  <div class="production__image">
    <img
      src="/main.png"
      alt="Интерьер со стеклянными перегородками — производство и монтаж Visla"
      width="960"
      height="1080"
      loading="eager"
      fetchpriority="high"
    />
  </div>
</section>
